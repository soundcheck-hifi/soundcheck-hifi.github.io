<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>SoundCheck – bald verfügbar</title>
<style>html,body{margin:0;height:100%;background:#121316;color:#f2ede4;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
h1{font-size:2rem;margin:0 0 12px;letter-spacing:.04em}p{opacity:.8;margin:0;max-width:30em;line-height:1.5}</style>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister()})});}
if(window.caches){caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})});}</script>
</head><body><main><h1>SoundCheck</h1><p>Wir arbeiten gerade an der App. Bald wieder verfügbar.</p></main></body></html>
